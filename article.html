<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    AztutMind | Article
</title>


<style>

:root {
    --bg: #f5f3ee;
    --white: #ffffff;
    --navy: #172033;
    --blue: #315a78;
    --gold: #c49a4b;
    --text: #29313d;
    --muted: #737b86;
    --border: #dedbd4;
}


* {
    box-sizing: border-box;
}


body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* HEADER */

header {

    background:
        var(--navy);

    color:
        white;

    padding:
        22px 6%;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

}


.logo {

    font-family:
        Georgia,
        serif;

    font-size:
        28px;

    letter-spacing:
        1px;

}


.logo span {
    color:
        var(--gold);
}


nav {
    display:
        flex;

    gap:
        25px;
}


nav a {

    color:
        white;

    text-decoration:
        none;

    font-size:
        14px;

}


nav a:hover {

    color:
        var(--gold);

}


/* ARTICLE */

.article-container {

    max-width:
        900px;

    margin:
        70px auto;

    padding:
        0 25px;

}


.article-category {

    color:
        var(--gold);

    text-transform:
        uppercase;

    letter-spacing:
        2px;

    font-size:
        12px;

    font-weight:
        bold;

    margin-bottom:
        15px;

}


.article-title {

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            40px,
            6vw,
            64px
        );

    line-height:
        1.08;

    color:
        var(--navy);

    margin:
        0 0 20px;

}


.article-summary {

    font-size:
        20px;

    line-height:
        1.7;

    color:
        var(--muted);

    border-left:
        3px solid
        var(--gold);

    padding-left:
        20px;

    margin-bottom:
        25px;

}


.article-meta {

    color:
        var(--muted);

    font-size:
        13px;

    margin-bottom:
        35px;

}


/* IMAGE */

.article-image {

    width:
        100%;

    max-height:
        550px;

    object-fit:
        cover;

    border-radius:
        12px;

    margin-bottom:
        45px;

}


.article-image-placeholder {

    width:
        100%;

    height:
        350px;

    border-radius:
        12px;

    background:
        linear-gradient(
            135deg,
            #e5e0d5,
            #f7f4ed
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        var(--blue);

    font-family:
        Georgia,
        serif;

    font-size:
        35px;

    margin-bottom:
        45px;

}


/* CONTENT */

.article-content {

    font-family:
        Georgia,
        serif;

    font-size:
        19px;

    line-height:
        1.85;

}


.article-content h2 {

    color:
        var(--navy);

    font-size:
        30px;

    margin-top:
        45px;

    margin-bottom:
        15px;

}


.article-content h3 {

    color:
        var(--navy);

    font-size:
        24px;

    margin-top:
        35px;

}


.article-content p {

    margin:
        0 0 22px;

}


.article-content strong {

    color:
        var(--navy);

}


.article-content ul,
.article-content ol {

    padding-left:
        30px;

    margin-bottom:
        25px;

}


.article-content li {

    margin-bottom:
        10px;

}


.article-content blockquote {

    border-left:
        4px solid
        var(--gold);

    padding:
        10px 20px;

    margin:
        30px 0;

    background:
        #efebe3;

    font-style:
        italic;

    color:
        var(--blue);

}


/* TAGS */

.tags {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;

    margin-top:
        50px;

    padding-top:
        25px;

    border-top:
        1px solid
        var(--border);

}


.tag {

    background:
        #e9e5dc;

    color:
        var(--blue);

    padding:
        7px 12px;

    border-radius:
        20px;

    font-size:
        12px;

}


/* BACK */

.back {

    margin-top:
        45px;

}


.back a {

    color:
        var(--blue);

    text-decoration:
        none;

    font-weight:
        bold;

    font-size:
        14px;

}


.back a:hover {

    color:
        var(--gold);

}


/* LOADING */

.loading {

    text-align:
        center;

    padding:
        100px 20px;

    color:
        var(--muted);

}


/* ERROR */

.error {

    text-align:
        center;

    padding:
        100px 20px;

}


.error h1 {

    font-family:
        Georgia,
        serif;

    color:
        var(--navy);

}


/* FOOTER */

footer {

    background:
        var(--navy);

    color:
        #d8dce2;

    padding:
        40px 6%;

    text-align:
        center;

    font-size:
        13px;

    margin-top:
        80px;

}


footer strong {
    color:
        white;
}


/* MOBILE */

@media(max-width:600px) {

    header {

        flex-direction:
            column;

        align-items:
            flex-start;

    }


    .article-container {

        margin-top:
            45px;

    }


    .article-title {

        font-size:
            40px;

    }


    .article-content {

        font-size:
            17px;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        Aztut<span>Mind</span>

    </div>


    <nav>

        <a href="index.html">
            Articles
        </a>

        <a href="https://aztutmind.com">
            Home
        </a>

    </nav>

</header>



<!-- ARTICLE -->

<main
    id="articleContainer"
    class="article-container"
>

    <div
        id="loading"
        class="loading">

        Loading article...

    </div>

</main>



<!-- FOOTER -->

<footer>

    <strong>AztutMind</strong>

    <br><br>

    Learn Smart. Achieve More.

</footer>



<script>

/* -----------------------------------------
   GET ARTICLE ID
----------------------------------------- */

const params =
    new URLSearchParams(
        window.location.search
    );


const articleId =
    params.get("id");


/* -----------------------------------------
   LOAD ARTICLE
----------------------------------------- */

async function loadArticle() {

    const container =
        document.getElementById(
            "articleContainer"
        );


    if (!articleId) {

        showError(
            "No article was specified."
        );

        return;

    }


    try {

        /*
         * Load manifest
         */

        const manifestResponse =
            await fetch(
                "json/manifest.json?" +
                Date.now()
            );


        if (!manifestResponse.ok) {

            throw new Error(
                "Manifest unavailable"
            );

        }


        const manifest =
            await manifestResponse.json();


        /*
         * Find requested article
         */

        const item =
            manifest.find(
                article =>
                    article.id === articleId
            );


        if (!item) {

            showError(
                "Article not found."
            );

            return;

        }


        /*
         * Don't display drafts publicly
         */

        if (
            item.status !==
            "published"
        ) {

            showError(
                "This article is not currently published."
            );

            return;

        }


        /*
         * Load actual article JSON
         */

        const response =
            await fetch(
                "json/" +
                item.file +
                "?" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Article JSON unavailable"
            );

        }


        const article =
            await response.json();


        /*
         * Display article
         */

        displayArticle(article);


    } catch(error) {

        console.error(error);

        showError(
            "Unable to load this article."
        );

    }

}


/* -----------------------------------------
   DISPLAY
----------------------------------------- */

function displayArticle(article) {

    const container =
        document.getElementById(
            "articleContainer"
        );


    document.title =
        "AztutMind | " +
        article.title;


    let imageHTML = "";


    if (article.image) {

        imageHTML = `

            <img
                class="article-image"
                src="${escapeAttribute(article.image)}"
                alt="${escapeAttribute(article.title)}"
                onerror="this.style.display='none'"
            >

        `;

    } else {

        imageHTML = `

            <div
                class="article-image-placeholder">

                AztutMind

            </div>

        `;

    }


    let tagsHTML = "";


    if (
        article.tags &&
        article.tags.length
    ) {

        tagsHTML = `

            <div class="tags">

                ${
                    article.tags
                    .map(
                        tag => `
                            <span class="tag">
                                ${escapeHTML(tag)}
                            </span>
                        `
                    )
                    .join("")
                }

            </div>

        `;

    }


    container.innerHTML = `

        <div class="article-category">

            ${escapeHTML(
                article.category ||
                "Article"
            )}

        </div>


        <h1 class="article-title">

            ${escapeHTML(
                article.title
            )}

        </h1>


        <div class="article-summary">

            ${escapeHTML(
                article.summary || ""
            )}

        </div>


        <div class="article-meta">

            By
            <strong>
                ${escapeHTML(
                    article.author ||
                    "AztutMind"
                )}
            </strong>

            &nbsp; • &nbsp;

            ${formatDate(
                article.date
            )}

        </div>


        ${imageHTML}


        <article
            class="article-content">

            ${article.content || ""}

        </article>


        ${tagsHTML}


        <div class="back">

            <a href="index.html">

                ← Back to Articles

            </a>

        </div>

    `;

}


/* -----------------------------------------
   ERROR
----------------------------------------- */

function showError(message) {

    document.getElementById(
        "articleContainer"
    ).innerHTML = `

        <div class="error">

            <h1>
                Article unavailable
            </h1>

            <p>
                ${escapeHTML(message)}
            </p>

            <div class="back">

                <a href="index.html">

                    ← Back to Articles

                </a>

            </div>

        </div>

    `;

}


/* -----------------------------------------
   DATE
----------------------------------------- */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(dateString);


    if (isNaN(date)) {
        return dateString;
    }


    return date.toLocaleDateString(
        undefined,
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/* -----------------------------------------
   SECURITY
----------------------------------------- */

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* -----------------------------------------
   START
----------------------------------------- */

loadArticle();

</script>

</body>

</html>
