<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="AztutMind Articles"
>

<title>AztutMind | Article</title>


<style>

:root {
    --bg: #f5f3ee;
    --white: #ffffff;
    --navy: #172033;
    --blue: #315a78;
    --gold: #c49a4b;
    --text: #29313d;
    --muted: #737b86;
    --border: #dedbd4;
    --soft: #efebe3;
    --green-soft: #eef5ef;
    --blue-soft: #eef4f8;
}


* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================
   HEADER
========================================= */

header {

    background: var(--navy);

    color: white;

    padding: 22px 6%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: sticky;

    top: 0;

    z-index: 1000;

}


.logo {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 28px;

    letter-spacing: 1px;

}


.logo span {

    color: var(--gold);

}


nav {

    display: flex;

    gap: 25px;

}


nav a {

    color: white;

    text-decoration: none;

    font-size: 14px;

    transition: 0.2s ease;

}


nav a:hover {

    color: var(--gold);

}


/* =========================================
   ARTICLE CONTAINER
========================================= */

.article-container {

    max-width: 950px;

    margin: 70px auto;

    padding: 0 25px;

}


/* =========================================
   CATEGORY
========================================= */

.article-category {

    color: var(--gold);

    text-transform: uppercase;

    letter-spacing: 2px;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 15px;

}


/* =========================================
   TITLE
========================================= */

.article-title {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            40px,
            6vw,
            64px
        );

    line-height: 1.08;

    color: var(--navy);

    margin: 0 0 25px;

}


/* =========================================
   SUMMARY
========================================= */

.article-summary {

    font-size: 20px;

    line-height: 1.7;

    color: var(--muted);

    border-left:
        3px solid
        var(--gold);

    padding-left: 20px;

    margin-bottom: 25px;

}


/* =========================================
   META
========================================= */

.article-meta {

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 35px;

}


.article-meta strong {

    color: var(--navy);

}


/* =========================================
   IMAGE
========================================= */

.article-image {

    width: 100%;

    max-height: 550px;

    object-fit: cover;

    border-radius: 12px;

    margin-bottom: 50px;

    display: block;

}


.article-image-placeholder {

    width: 100%;

    min-height: 350px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #e5e0d5,
            #f7f4ed
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--blue);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 35px;

    margin-bottom: 50px;

}


/* =========================================
   RICH ARTICLE CONTENT
========================================= */

.article-content {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 19px;

    line-height: 1.85;

    color: var(--text);

}


/* Paragraph */

.article-content p {

    margin:
        0 0 22px;

}


/* H2 */

.article-content h2 {

    color: var(--navy);

    font-size: 30px;

    line-height: 1.3;

    margin:
        55px 0 18px;

}


/* H3 */

.article-content h3 {

    color: var(--navy);

    font-size: 23px;

    line-height: 1.4;

    margin:
        38px 0 14px;

}


/* H4 */

.article-content h4 {

    color: var(--blue);

    font-size: 20px;

    margin:
        30px 0 12px;

}


/* Strong */

.article-content strong {

    color: var(--navy);

}


/* Emphasis */

.article-content em {

    color: var(--blue);

}


/* Links */

.article-content a {

    color: var(--blue);

    text-decoration:
        underline;

}


.article-content a:hover {

    color: var(--gold);

}


/* Lists */

.article-content ul,
.article-content ol {

    padding-left: 30px;

    margin:
        0 0 28px;

}


.article-content li {

    margin-bottom: 10px;

}


/* Blockquote */

.article-content blockquote {

    border-left:
        4px solid
        var(--gold);

    padding:
        15px 22px;

    margin:
        32px 0;

    background:
        var(--soft);

    font-style:
        italic;

    color:
        var(--blue);

    border-radius:
        0 8px 8px 0;

}


.article-content blockquote p {

    margin-bottom: 0;

}


/* Tables */

.article-content table {

    width: 100%;

    border-collapse:
        collapse;

    margin:
        30px 0;

    background:
        var(--white);

    border:
        1px solid
        var(--border);

    border-radius:
        10px;

    overflow:
        hidden;

}


.article-content th {

    background:
        var(--navy);

    color:
        white;

    padding:
        14px;

    text-align:
        left;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        14px;

}


.article-content td {

    padding:
        14px;

    border-bottom:
        1px solid
        var(--border);

    vertical-align:
        top;

}


.article-content tr:last-child td {

    border-bottom:
        none;

}


/* Images inserted through Rich Text */

.article-content img {

    max-width:
        100%;

    height:
        auto;

    display:
        block;

    margin:
        30px auto;

    border-radius:
        10px;

}


/* Horizontal rule */

.article-content hr {

    border:
        none;

    border-top:
        1px solid
        var(--border);

    margin:
        45px 0;

}


/* Code */

.article-content code {

    background:
        #eeeae2;

    padding:
        3px 7px;

    border-radius:
        4px;

    font-family:
        monospace;

    font-size:
        0.9em;

}


/* =========================================
   SPECIAL CONTENT BOXES
========================================= */

.article-content .callout {

    padding:
        25px;

    margin:
        30px 0;

    background:
        var(--soft);

    border-left:
        5px solid
        var(--gold);

    border-radius:
        8px;

}


.article-content .highlight {

    padding:
        25px;

    margin:
        30px 0;

    background:
        var(--green-soft);

    border-radius:
        12px;

}


.article-content .info {

    padding:
        25px;

    margin:
        30px 0;

    background:
        var(--blue-soft);

    border-radius:
        12px;

}


/* =========================================
   TAGS
========================================= */

.tags {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;

    margin-top:
        55px;

    padding-top:
        25px;

    border-top:
        1px solid
        var(--border);

}


.tag {

    background:
        #e9e5dc;

    color:
        var(--blue);

    padding:
        7px 12px;

    border-radius:
        20px;

    font-size:
        12px;

}


/* =========================================
   BACK LINK
========================================= */

.back {

    margin-top:
        45px;

}


.back a {

    color:
        var(--blue);

    text-decoration:
        none;

    font-weight:
        bold;

    font-size:
        14px;

}


.back a:hover {

    color:
        var(--gold);

}


/* =========================================
   LOADING
========================================= */

.loading {

    text-align:
        center;

    padding:
        120px 20px;

    color:
        var(--muted);

}


/* =========================================
   ERROR
========================================= */

.error {

    text-align:
        center;

    padding:
        100px 20px;

}


.error h1 {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color:
        var(--navy);

}


/* =========================================
   FOOTER
========================================= */

footer {

    background:
        var(--navy);

    color:
        #d8dce2;

    padding:
        40px 6%;

    text-align:
        center;

    font-size:
        13px;

    margin-top:
        80px;

}


footer strong {

    color:
        white;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 700px) {

    header {

        padding:
            18px 5%;

        flex-direction:
            column;

        align-items:
            flex-start;

        gap:
            15px;

    }


    nav {

        gap:
            18px;

    }


    .article-container {

        margin-top:
            45px;

        padding:
            0 20px;

    }


    .article-title {

        font-size:
            40px;

    }


    .article-summary {

        font-size:
            18px;

    }


    .article-content {

        font-size:
            17px;

        line-height:
            1.75;

    }


    .article-content h2 {

        font-size:
            27px;

    }


    .article-content h3 {

        font-size:
            21px;

    }


    .article-content table {

        display:
            block;

        overflow-x:
            auto;

        white-space:
            nowrap;

    }


    .article-image-placeholder {

        min-height:
            230px;

        font-size:
            28px;

    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">

        Aztut<span>Mind</span>

    </div>


    <nav>

        <a href="index.html">
            Articles
        </a>

        <a
            href="https://aztutmind.com"
            target="_blank"
            rel="noopener"
        >
            Home
        </a>

    </nav>

</header>



<!-- =========================================
     ARTICLE
========================================= -->

<main
    id="articleContainer"
    class="article-container"
>

    <div
        id="loading"
        class="loading"
    >

        Loading article...

    </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <strong>AztutMind</strong>

    <br><br>

    Learn Smart. Achieve More.

</footer>



<script>


/* =========================================
   GET ARTICLE ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const articleId =
    params.get("id");


/* =========================================
   PATHS
========================================= */

const JSON_FOLDER =
    "json/";


/* =========================================
   LOAD ARTICLE
========================================= */

async function loadArticle() {

    const container =
        document.getElementById(
            "articleContainer"
        );


    if (!articleId) {

        showError(
            "No article was specified."
        );

        return;

    }


    try {

        /* ---------------------------------
           LOAD MANIFEST
        --------------------------------- */

        const manifestResponse =
            await fetch(
                JSON_FOLDER +
                "manifest.json?" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!manifestResponse.ok) {

            throw new Error(
                "Manifest unavailable"
            );

        }


        const manifest =
            await manifestResponse.json();


        if (!Array.isArray(manifest)) {

            throw new Error(
                "Manifest format is invalid"
            );

        }


        /* ---------------------------------
           FIND ARTICLE
        --------------------------------- */

        const item =
            manifest.find(
                article =>
                    String(article.id) ===
                    String(articleId)
            );


        if (!item) {

            showError(
                "Article not found."
            );

            return;

        }


        /* ---------------------------------
           CHECK STATUS
        --------------------------------- */

        if (
            String(
                item.status || ""
            ).toLowerCase() !==
            "published"
        ) {

            showError(
                "This article is not currently published."
            );

            return;

        }


        /* ---------------------------------
           GET ARTICLE FILE
        --------------------------------- */

        let articleFile =
            String(
                item.file || ""
            ).trim();


        if (!articleFile) {

            throw new Error(
                "Article file is missing from manifest."
            );

        }


        /*
         * Supports BOTH:
         *
         * article-001.json
         *
         * AND
         *
         * json/article-001.json
         *
         */

        if (
            articleFile.startsWith(
                "json/"
            )
        ) {

            articleFile =
                articleFile.substring(
                    5
                );

        }


        const articleURL =
            JSON_FOLDER +
            articleFile +
            "?" +
            Date.now();


        const response =
            await fetch(
                articleURL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Article JSON unavailable: " +
                response.status
            );

        }


        const article =
            await response.json();


        /* ---------------------------------
           DISPLAY
        --------------------------------- */

        displayArticle(
            article
        );


    }

    catch(error) {

        console.error(
            "Article loading error:",
            error
        );


        showError(
            "Unable to load this article."
        );

    }

}


/* =========================================
   DISPLAY ARTICLE
========================================= */

function displayArticle(article) {

    const container =
        document.getElementById(
            "articleContainer"
        );


    document.title =
        "AztutMind | " +
        (
            article.title ||
            "Article"
        );


    /* ---------------------------------
       IMAGE
    --------------------------------- */

    let imageHTML = "";


    if (
        article.image &&
        String(article.image).trim()
    ) {

        imageHTML = `

            <img
                class="article-image"
                src="${escapeAttribute(
                    article.image
                )}"
                alt="${escapeAttribute(
                    article.title ||
                    "AztutMind Article"
                )}"
                onerror="
                    this.onerror=null;
                    this.style.display='none';
                "
            >

        `;

    }

    else {

        imageHTML = `

            <div
                class="article-image-placeholder"
            >

                AztutMind

            </div>

        `;

    }


    /* ---------------------------------
       TAGS
    --------------------------------- */

    let tagsHTML = "";


    if (
        Array.isArray(
            article.tags
        ) &&
        article.tags.length
    ) {

        tagsHTML = `

            <div class="tags">

                ${
                    article.tags
                    .map(
                        tag => `

                            <span
                                class="tag"
                            >

                                ${escapeHTML(
                                    tag
                                )}

                            </span>

                        `
                    )
                    .join("")
                }

            </div>

        `;

    }


    /* ---------------------------------
       CONTENT
    --------------------------------- */

    const content =
        article.content ||
        "<p>No article content available.</p>";


    /* ---------------------------------
       RENDER
    --------------------------------- */

    container.innerHTML = `

        <div
            class="article-category"
        >

            ${escapeHTML(
                article.category ||
                "Article"
            )}

        </div>


        <h1
            class="article-title"
        >

            ${escapeHTML(
                article.title ||
                "Untitled Article"
            )}

        </h1>


        ${
            article.summary
            ?
            `

                <div
                    class="article-summary"
                >

                    ${escapeHTML(
                        article.summary
                    )}

                </div>

            `
            :
            ""
        }


        <div
            class="article-meta"
        >

            By

            <strong>
                ${escapeHTML(
                    article.author ||
                    "AztutMind"
                )}
            </strong>

            &nbsp; • &nbsp;

            ${formatDate(
                article.date
            )}

        </div>


        ${imageHTML}


        <article
            class="article-content"
        >

            ${content}

        </article>


        ${tagsHTML}


        <div
            class="back"
        >

            <a
                href="index.html"
            >

                ← Back to Articles

            </a>

        </div>

    `;

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

    document.getElementById(
        "articleContainer"
    ).innerHTML = `

        <div
            class="error"
        >

            <h1>
                Article unavailable
            </h1>


            <p>
                ${escapeHTML(
                    message
                )}
            </p>


            <div
                class="back"
            >

                <a
                    href="index.html"
                >

                    ← Back to Articles

                </a>

            </div>

        </div>

    `;

}


/* =========================================
   DATE
========================================= */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "";

    }


    const date =
        new Date(
            dateString
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }


    return date.toLocaleDateString(
        undefined,
        {
            year:
                "numeric",

            month:
                "long",

            day:
                "numeric"
        }
    );

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(
    value
) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


/* =========================================
   START
========================================= */

loadArticle();

</script>


</body>

</html>
